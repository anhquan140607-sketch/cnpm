<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Quản lý Test Plan & Test Cases</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-8">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold text-emerald-400 mb-2">🧪 Test Plan & Test Cases Execution Dashboard</h1>
        <p class="text-slate-400 mb-6">Task Jira: CNPM-51 / CNPM-144 | Bảng điều khiển kiểm thử 5 Core Flows hệ thống.</p>
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
                <div class="text-slate-400 text-xs">Tổng Test Cases</div>
                <div class="text-2xl font-bold text-white">20 Cases</div>
            </div>
            <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
                <div class="text-slate-400 text-xs">Đã Passed</div>
                <div class="text-2xl font-bold text-emerald-400">18</div>
            </div>
            <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
                <div class="text-slate-400 text-xs">Failed / Bug</div>
                <div class="text-2xl font-bold text-rose-400">0</div>
            </div>
            <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
                <div class="text-slate-400 text-xs">Tiến độ kiểm thử</div>
                <div class="text-2xl font-bold text-amber-400">90%</div>
            </div>
        </div>
    </div>
</body>
</html>
